name: Release

# Publishes to npm when a version tag (v0.1.1, ...) is pushed, after the
# same checks as CI. Uses npm trusted publishing: no token is stored. The
# first version is published by hand (RELEASING.md), because npm can only
# trust a workflow for a package that already exists.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:templates
      - run: pnpm check:package
      # A version published by hand (the first one) is skipped, not re-sent.
      - name: Is this version on npm already?
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "tiny-ai-chat@$version" version >/dev/null 2>&1; then
            echo "tiny-ai-chat@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.published.outputs.skip != 'true'
        run: npm install -g npm@11
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
