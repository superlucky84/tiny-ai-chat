<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tiny-ai-chat host page</title>
    <!--
      This page plays a website that embeds the chat. It knows nothing about
      lithent: it loads one script and places one tag.
    -->
    <style>
      body {
        margin: 0;
        padding: 32px 16px;
        background: #f8fafc;
        color: #0f172a;
        font:
          16px/1.6 Georgia,
          'Times New Roman',
          serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
      }
      /* Page styles that would wreck an unprotected widget. */
      button,
      textarea {
        font:
          14px/1 'Courier New',
          monospace;
        text-transform: uppercase;
        background: #fde68a;
        border: 2px dashed #92400e;
      }
      p {
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A site that embeds tiny-ai-chat</h1>
      <p>
        The chat button in the corner is the widget, loaded from a single
        script. This page's button and paragraph styles do not reach inside it.
      </p>
      <button type="button">A page button</button>
    </main>

    <tiny-ai-chat
      endpoint="/api/chat"
      heading="Ask this site"
      greeting="Hi! Ask me anything about this site."
    ></tiny-ai-chat>

    <script type="module" src="/src/widget/main.ts"></script>
  </body>
</html>
